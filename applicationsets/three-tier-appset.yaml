apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-gitops
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: todo-3tier
spec:
  generators:
    - git:
        repoURL: https://github.com/lekhana-vemuri/To-Do-environments.git
        revision: main
        directories:
          - path: staging
          - path: production
  template:
    metadata:
      name: '{{path.basename}}-app'
      labels:
        app.kubernetes.io/part-of: todo-3tier
        managed-by: argocd-applicationset
    spec:
      project: todo-3tier
      source:
        repoURL: https://github.com/lekhana-vemuri/To-Do-environments.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'todo-3tier-{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      revisionHistoryLimit: 3
