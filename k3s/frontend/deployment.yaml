apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  namespace: todo-3tier-staging
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: todo-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: todo-frontend
        app.kubernetes.io/name: todo-frontend
        app.kubernetes.io/part-of: todo-3tier
    spec:
      containers:
        - name: todo-frontend
          image: lekhanavemuri/todo-frontend:v24
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/nginx/html/env-config.js
              subPath: env-config.js
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
      volumes:
        - name: config-volume
          configMap:
            name: todo-config
            items:
              - key: env-config.js
                path: env-config.js
