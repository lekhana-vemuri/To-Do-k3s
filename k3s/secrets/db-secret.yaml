apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: todo-db-secret
  namespace: todo-3tier

spec:
  refreshInterval: 1m

  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  target:
    name: todo-db-secret

  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: todo-db
        property: POSTGRES_DB

    - secretKey: POSTGRES_USER
      remoteRef:
        key: todo-db
        property: POSTGRES_USER

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: todo-db
        property: POSTGRES_PASSWORD