apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: todo-frontend-secret
  namespace: todo-3tier

spec:
  refreshInterval: 1m

  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  target:
    name: todo-frontend-secret

  data:
    - secretKey: REACT_APP_API_URL
      remoteRef:
        key: todo-frontend
        property: REACT_APP_API_URL