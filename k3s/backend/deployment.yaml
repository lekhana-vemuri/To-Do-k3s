apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: todo-backend
          image: lekhanavemuri/todo-backend:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6001
          envFrom:
            - secretRef:
                name: todo-secret
            - configMapRef:
                name: todo-config
          startupProbe:
            tcpSocket:
              port: 6001
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6001
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
