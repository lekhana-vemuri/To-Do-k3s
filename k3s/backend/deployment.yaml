apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: todo-3tier-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: backend
          image: lekhanavemuri/todo-backend:20
          ports:
            - containerPort: 6001
          envFrom:
            - configMapRef:
                name: todo-config
            - secretRef:
                name: todo-secret
