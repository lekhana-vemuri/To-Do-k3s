apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: todo-secret
  namespace: todo-3tier

  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore

  target:
    name: todo-secret
    creationPolicy: Owner

  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: todo-backend-secret
        property: POSTGRES_DB

    - secretKey: POSTGRES_USER
      remoteRef:
        key: todo-backend-secret
        property: POSTGRES_USER

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: todo-backend-secret
        property: POSTGRES_PASSWORD

    - secretKey: POSTGRES_HOST
      remoteRef:
        key: todo-backend-secret
        property: POSTGRES_HOST

    - secretKey: POSTGRES_PORT
      remoteRef:
        key: todo-backend-secret
        property: POSTGRES_PORT

    - secretKey: BACKEND_PORT
      remoteRef:
        key: todo-backend-secret
        property: BACKEND_PORT

    - secretKey: REACT_APP_API_URL
      remoteRef:
        key: todo-frontend-secret
        property: REACT_APP_API_URL